name: Weekly pipeline update

# Cron: 06:00 UTC every Sunday.
# Manual runs are also enabled from the Actions tab via workflow_dispatch.
on:
  schedule:
    - cron: "0 6 * * 0"
  workflow_dispatch:
    inputs:
      steps:
        description: "Pipeline steps ('all' or comma-separated list, e.g. '1,2,4')"
        required: false
        default: "all"
      deploy_shiny:
        description: "Redeploy Shiny app at the end ('true' or 'false')"
        required: false
        default: "true"

permissions:
  contents: write   # required to commit processed CSVs back to the repo

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # ~5h50m, within the 6h free-tier limit

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download raw data (Retraction Watch + NIH ExPORTER)
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NIH_RAW_RELEASE_URL: https://github.com/${{ github.repository }}/releases/latest/download/nih_raw.tar.gz
        run: python -m src.downloader

      - name: Run pipeline
        env:
          ENTREZ_EMAIL: ${{ secrets.ENTREZ_EMAIL }}
          ENTREZ_API_KEY: ${{ secrets.ENTREZ_API_KEY }}
        run: python main.py --steps "${{ github.event.inputs.steps || 'all' }}"

      - name: Upload processed CSVs as artifact
        uses: actions/upload-artifact@v4
        with:
          name: processed-data-${{ github.run_id }}
          path: data/processed/*.csv
          if-no-files-found: error
          retention-days: 90

      - name: Commit processed CSVs back to repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed/*.csv || true
          if git diff --cached --quiet; then
            echo "No changes in data/processed; nothing to commit."
          else
            git commit -m "chore(data): quarterly update $(date -u +%Y-%m-%d)"
            git push
          fi

      # ----------------------------------------------------------------------
      # Automatic Shiny app deployment to shinyapps.io.
      # ----------------------------------------------------------------------
      - name: Set up R
        if: ${{ github.event.inputs.deploy_shiny != 'false' }}
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.3"
          # Intentionally NOT using Posit Public Package Manager. Although
          # PPM serves pre-compiled binaries (faster install), it stamps every
          # package with the alias "RSPM" in the rsconnect manifest, which
          # shinyapps.io's build server treats as a literal URL prefix and
          # rejects with "Unsupported url scheme: RSPM/src/contrib/...".
          # Plain CRAN takes longer to install the first time (compiles from
          # source) but yields resolvable URLs. The R-package cache in the
          # next step keeps subsequent runs fast.
          use-public-rspm: false

      - name: Install rsconnect and Shiny app dependencies
        if: ${{ github.event.inputs.deploy_shiny != 'false' }}
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::rsconnect
            any::shiny
            any::tidyverse
            any::scales
            any::lubridate
            any::DT
            any::plotly
            any::shinycssloaders
            any::quantmod
            any::zoo
            any::cpp11
            any::progress
            any::haven
            any::readxl
            any::vroom
            any::isoband
          cache-version: 4

      - name: Deploy Shiny app
        if: ${{ github.event.inputs.deploy_shiny != 'false' }}
        env:
          SHINYAPPS_NAME: ${{ secrets.SHINYAPPS_NAME }}
          SHINYAPPS_TOKEN: ${{ secrets.SHINYAPPS_TOKEN }}
          SHINYAPPS_SECRET: ${{ secrets.SHINYAPPS_SECRET }}
          SHINYAPPS_APPNAME: ${{ secrets.SHINYAPPS_APPNAME }}
          RENV_CONFIG_VALIDATE: "FALSE"
        run: Rscript deploy_shiny.R
