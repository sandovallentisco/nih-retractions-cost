name: Quarterly pipeline update

# Cron: 06:00 UTC on the 1st of every third month (Jan, Apr, Jul, Oct).
# Manual runs are also enabled from the Actions tab via workflow_dispatch.
on:
  schedule:
    - cron: "0 6 1 */3 *"
  workflow_dispatch:
    inputs:
      steps:
        description: "Pipeline steps ('all' or comma-separated list, e.g. '1,2,4')"
        required: false
        default: "all"
      deploy_shiny:
        description: "Redeploy Shiny app at the end ('true' or 'false')"
        required: false
        default: "true"

permissions:
  contents: write   # required to commit processed CSVs back to the repo

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # ~5h50m, within the 6h free-tier limit

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download raw data (Retraction Watch + NIH ExPORTER)
        # NIH no longer publishes stable bulk download URLs, so the NIH raw
        # data is fetched as a tarball published as a Release asset on this
        # repository. NIH_RAW_RELEASE_URL points at the "latest" release of
        # the current repo, so updates require nothing more than uploading
        # a new release with the same asset name (nih_raw.tar.gz).
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NIH_RAW_RELEASE_URL: https://github.com/${{ github.repository }}/releases/latest/download/nih_raw.tar.gz
        run: python -m src.downloader

      - name: Run pipeline
        env:
          ENTREZ_EMAIL: ${{ secrets.ENTREZ_EMAIL }}
          ENTREZ_API_KEY: ${{ secrets.ENTREZ_API_KEY }}
        run: python main.py --steps "${{ github.event.inputs.steps || 'all' }}"

      - name: Upload processed CSVs as artifact
        uses: actions/upload-artifact@v4
        with:
          name: processed-data-${{ github.run_id }}
          path: data/processed/*.csv
          if-no-files-found: error
          retention-days: 90

      - name: Commit processed CSVs back to repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed/*.csv || true
          if git diff --cached --quiet; then
            echo "No changes in data/processed; nothing to commit."
          else
            git commit -m "chore(data): quarterly update $(date -u +%Y-%m-%d)"
            git push
          fi

      # ----------------------------------------------------------------------
      # Automatic Shiny app deployment to shinyapps.io.
      # Requires the following repository secrets:
      #   SHINYAPPS_NAME, SHINYAPPS_TOKEN, SHINYAPPS_SECRET
      # ----------------------------------------------------------------------
      - name: Set up R
        if: ${{ github.event.inputs.deploy_shiny != 'false' }}
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.3"

      - name: Cache R packages
        if: ${{ github.event.inputs.deploy_shiny != 'false' }}
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-${{ runner.os }}-rsconnect-v1

      - name: Install rsconnect
        if: ${{ github.event.inputs.deploy_shiny != 'false' }}
        run: |
          Rscript -e 'if (!requireNamespace("rsconnect", quietly = TRUE)) install.packages("rsconnect", repos = "https://cloud.r-project.org")'

      - name: Deploy Shiny app
        if: ${{ github.event.inputs.deploy_shiny != 'false' }}
        env:
          SHINYAPPS_NAME:    ${{ secrets.SHINYAPPS_NAME }}
          SHINYAPPS_TOKEN:   ${{ secrets.SHINYAPPS_TOKEN }}
          SHINYAPPS_SECRET:  ${{ secrets.SHINYAPPS_SECRET }}
          SHINYAPPS_APPNAME: ${{ secrets.SHINYAPPS_APPNAME }}
        run: Rscript deploy_shiny.R
